services:
  qwen38-dflash2-tp4:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-harbor.sourcefind.cn:5443/dcu/admin/base/custom@sha256:366525b25f452f85eb0ea5813604a64f03c648627bc824bb498b56cf5a325dde}
    image: qwen38-w8a8-k100ai-dflash2-tp4:local
    container_name: qwen38-w8a8-k100ai-dflash2-tp4
    network_mode: host
    ipc: host
    restart: unless-stopped
    security_opt:
      - label=disable
    devices:
      - /dev/kfd:/dev/kfd
      - ${RENDER0}:${RENDER0}
      - ${RENDER1}:${RENDER1}
      - ${RENDER2}:${RENDER2}
      - ${RENDER3}:${RENDER3}
    volumes:
      - ${TARGET_MODEL}:/models/target:ro
      - ${DRAFT_MODEL}:/models/draft:ro
      - /opt/hyhal:/opt/hyhal:ro
    environment:
      HIP_VISIBLE_DEVICES: "0,1,2,3"
      PORT: ${PORT:-8068}
      SGLANG_Q38_TP4_U036_PROFILE: ${U036_PROFILE:-legacy_bm64_w8}
      SGLANG_Q38_TP4_U036_SPLIT_KV: ${U036_SPLIT_KV:-1}
